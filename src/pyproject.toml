[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mersik"
version = "0.3.0"
description = "A command-line tool for managing FLAC and WavPack metadata"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "pillow>=10",
]

[project.scripts]
mersik = "mersik:main"

[tool.setuptools]
py-modules = ["mersik"]
